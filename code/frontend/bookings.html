<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bookings - Telemedicine Portal</title>
  <style>
    :root {
      --bg: #fefefe;
      --text: #1c1c1e;
      --subtext: #555;
      --primary: #007aff;
      --card: #ffffff;
      --error: #ff3b30;
      --completed: #34c759;
      --cancelled: #ff9500;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background-color: var(--card);
      padding: 2rem 1rem;
      text-align: center;
      border-bottom: 1px solid #ddd;
      animation: fadeIn 1s ease-out;
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 0;
      margin-top: 1rem;
    }

    nav ul li a {
      text-decoration: none;
      color: var(--primary);
      font-weight: 600;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      transition: background-color 0.3s ease;
    }

    nav ul li a:hover {
      background-color: rgba(0, 122, 255, 0.1);
    }

    main {
      max-width: 800px;
      margin: 4rem auto;
      padding: 1rem;
      animation: fadeInUp 1s ease-out;
    }

    h2 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 2rem;
    }

    .appointments-section {
      margin-bottom: 3rem;
    }

    .section-title {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #eee;
      color: var(--subtext);
    }

    #login-message {
      text-align: center;
      margin: 2rem 0;
      font-weight: 600;
      color: var(--error);
    }

    ul.appointments-list {
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    ul.appointments-list li {
      background-color: var(--card);
      padding: 1.5rem;
      border-radius: 16px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    ul.appointments-list li:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
    }

    ul.appointments-list li span {
      font-weight: 500;
      color: var(--text);
    }

    .status-completed {
      color: var(--completed);
      font-weight: 600;
    }

    .status-cancelled {
      color: var(--cancelled);
      font-weight: 600;
    }

    .status-confirmed {
      color: var(--primary);
      font-weight: 600;
    }

    .status-booked {
      font-weight: 600;
    }

    .cancel-btn {
      background-color: var(--error);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    .cancel-btn:hover {
      opacity: 0.8;
    }

    .report-link {
      color: var(--primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .report-link:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.9rem;
      color: #999;
      border-top: 1px solid #eee;
      margin-top: 4rem;
      animation: fadeIn 1s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      ul.appointments-list li {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="appointments.html">Book Appointment</a></li>
        <li><a href="#" id="secure-chat-link">Secure Chat</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>My Booked Appointments</h2>
    
    <div id="login-message" style="display: none;">
      Please <a href="login.html">login</a> to view your appointments.
    </div>

    <div id="active-appointments" class="appointments-section" style="display: none;">
      <h3 class="section-title">Upcoming & Completed Appointments</h3>
      <ul class="appointments-list">
        <!-- Active appointments will be loaded here -->
      </ul>
    </div>

    <div id="cancelled-appointments" class="appointments-section" style="display: none;">
      <h3 class="section-title">Cancelled Appointments</h3>
      <ul class="appointments-list">
        <!-- Cancelled appointments will be loaded here -->
      </ul>
    </div>

    <div id="no-appointments" style="display: none; text-align: center; margin: 2rem 0;">
      You have no appointments.<br>
      <a href="appointments.html" style="color: var(--primary);">Book one now</a>
    </div>

  </main>

  <footer>
    <p>&copy; 2025 Telemedicine Portal</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('token');
      const activeAppointmentsSection = document.getElementById('active-appointments');
      const cancelledAppointmentsSection = document.getElementById('cancelled-appointments');
      const noAppointmentsMessage = document.getElementById('no-appointments');
      const loginMessage = document.getElementById('login-message');
      const secureChatLink = document.getElementById('secure-chat-link');

      // Update chat link based on user type
      const userType = localStorage.getItem('user_type');
      if (userType === 'doctor') {
        secureChatLink.href = 'doctor-chat.html';
      } else {
        secureChatLink.href = 'chat.html';
      }

      if (!token) {
        showLoginPrompt();
        return;
      }

      try {
        const verifyResponse = await fetch('http://localhost:5501/user-data', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!verifyResponse.ok) {
          throw new Error('Session expired');
        }

        const userData = await verifyResponse.json();
        const userId = userData.id;
        const userType = userData.type;

        const appointments = await loadAppointments(token);

        if (appointments.length > 0) {
          const { activeAppointments, cancelledAppointments } = separateAppointments(appointments);
          
          if (activeAppointments.length > 0) {
            renderAppointments(activeAppointments, 'active', userId, userType);
            activeAppointmentsSection.style.display = 'block';
          }
          
          if (cancelledAppointments.length > 0) {
            renderAppointments(cancelledAppointments, 'cancelled', userId, userType);
            cancelledAppointmentsSection.style.display = 'block';
          }
          
          if (activeAppointments.length === 0 && cancelledAppointments.length === 0) {
            showNoAppointments();
          }
          
          setupCancelButtons(token);
        } else {
          showNoAppointments();
        }

        loginMessage.style.display = 'none';
      } catch (error) {
        console.error('Error:', error);
        handleError(error);
      }
    });

    function separateAppointments(appointments) {
      const activeAppointments = [];
      const cancelledAppointments = [];
      
      appointments.forEach(appt => {
        if (appt.status.toLowerCase() === 'cancelled') {
          cancelledAppointments.push(appt);
        } else {
          activeAppointments.push(appt);
        }
      });
      
      return { activeAppointments, cancelledAppointments };
    }

    async function loadAppointments(token) {
      const response = await fetch('http://localhost:5501/appointments', {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (!response.ok) {
        throw new Error('Failed to load appointments');
      }

      const data = await response.json();
      return data.appointments;
    }

    function renderAppointments(appointments, type, userId, userType) {
      const container = type === 'cancelled' 
        ? document.querySelector('#cancelled-appointments .appointments-list')
        : document.querySelector('#active-appointments .appointments-list');

      container.innerHTML = appointments.map(appt => {
        const doctorName = appt.doctor_name || `${appt.doctor_nome} ${appt.doctor_cognome}` || 'Doctor';
        const date = new Date(appt.date);
        const formattedDate = date.toLocaleDateString('en-US', {
          weekday: 'short',
          month: 'short',
          day: 'numeric'
        });

        // Format report link if available
        let reportLink = '';
        if (appt.medical_report_url) {
          const reportUrl = appt.medical_report_url.startsWith('http') 
            ? appt.medical_report_url 
            : `http://localhost:5501${appt.medical_report_url}`;
          
          reportLink = `
            <a href="${reportUrl}" target="_blank" class="report-link">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 12H15M12 9L12 15M12 3C16.9706 3 21 7.02944 21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
              View Report
            </a>
          `;
        }

        return `
          <li>
            <span>📅 ${formattedDate}</span>
            <span>🕒 ${appt.time}</span>
            <span>👨‍⚕️ ${doctorName}</span>
            <span class="status-${appt.status.toLowerCase()}">${appt.status}</span>
            ${reportLink || '<span>No report</span>'}
            ${type !== 'cancelled' && appt.status !== 'completed' ? `
              <button class="cancel-btn" data-id="${appt.id}">Cancel</button>
            ` : ''}
          </li>
        `;
      }).join('');
    }

    function setupCancelButtons(token) {
      document.querySelectorAll('.cancel-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Are you sure you want to cancel this appointment?')) return;

          try {
            const response = await fetch(`http://localhost:5501/appointments/${btn.dataset.id}`, {
              method: 'DELETE',
              headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!response.ok) {
              throw new Error('Failed to cancel appointment');
            }

            location.reload();
          } catch (error) {
            console.error('Error:', error);
            alert(`Error: ${error.message}`);
          }
        });
      });
    }

    function showLoginPrompt() {
      document.getElementById('active-appointments').style.display = 'none';
      document.getElementById('cancelled-appointments').style.display = 'none';
      document.getElementById('no-appointments').style.display = 'none';
      document.getElementById('login-message').style.display = 'block';
    }

    function showNoAppointments() {
      document.getElementById('active-appointments').style.display = 'none';
      document.getElementById('cancelled-appointments').style.display = 'none';
      document.getElementById('no-appointments').style.display = 'block';
      document.getElementById('login-message').style.display = 'none';
    }

    function handleError(error) {
      if (error.message.includes('Session')) {
        localStorage.clear();
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('active-appointments').style.display = 'none';
      document.getElementById('cancelled-appointments').style.display = 'none';
      document.getElementById('no-appointments').style.display = 'none';
      document.getElementById('login-message').style.display = 'none';
      
      const errorDiv = document.createElement('div');
      errorDiv.style.color = 'var(--error)';
      errorDiv.style.textAlign = 'center';
      errorDiv.style.margin = '2rem 0';
      errorDiv.innerHTML = `
        ${error.message}<br>
        <button onclick="location.reload()" style="margin-top: 1rem; padding: 0.5rem 1rem; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer;">Retry</button>
      `;
      
      document.querySelector('main').appendChild(errorDiv);
    }
  </script>
</body>
</html>
