<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://www.paypal.com/sdk/js?client-id=Addsl8iI8tBYlJu5RQE9sK7Ap9v2V1hSOrj9YsDPQAttyuaR-CC6NkPed15aITKZS-7i_B8SHf7QppB9&currency=EUR"></script>
  <title>Payments - Telemedicine Portal</title>
  <style>
    :root {
      --bg: #fefefe;
      --text: #1c1c1e;
      --subtext: #555;
      --primary: #007aff;
      --card: #ffffff;
      --error: #ff3b30;
      --success: #34c759;
      --warning: #ff9500;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background-color: var(--card);
      padding: 2rem 1rem;
      text-align: center;
      border-bottom: 1px solid #ddd;
      animation: fadeIn 1s ease-out;
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 0;
      margin-top: 1rem;
    }

    nav ul li a {
      text-decoration: none;
      color: var(--primary);
      font-weight: 600;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      transition: background-color 0.3s ease;
    }

    nav ul li a:hover {
      background-color: rgba(0, 122, 255, 0.1);
    }

    main {
      max-width: 800px;
      margin: 4rem auto;
      padding: 1rem;
      animation: fadeInUp 1s ease-out;
    }

    h2 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 2rem;
    }

    #login-message {
      text-align: center;
      margin: 2rem 0;
      font-weight: 600;
      color: var(--error);
    }

    .card {
      background-color: var(--card);
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
      margin-bottom: 2rem;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: var(--subtext);
    }

    input, select {
      width: 100%;
      padding: 1rem;
      font-size: 1rem;
      border: 1px solid #ddd;
      border-radius: 12px;
      background-color: #f8f8f8;
      transition: border-color 0.3s ease;
      font-family: inherit;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
    }

    .btn {
      padding: 1rem;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.3s ease;
      width: 100%;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .payment-section {
      display: none;
      margin-top: 1.5rem;
      padding: 1.5rem;
      background-color: #f8f8f8;
      border-radius: 12px;
      border: 1px solid #eee;
      animation: fadeIn 0.4s ease-out;
    }

    .message {
      text-align: center;
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 12px;
      font-weight: 500;
      animation: fadeIn 0.4s ease-out;
    }

    .success {
      background-color: rgba(52, 199, 89, 0.1);
      color: var(--success);
      border: 1px solid rgba(52, 199, 89, 0.3);
    }

    .error {
      background-color: rgba(255, 59, 48, 0.1);
      color: var(--error);
      border: 1px solid rgba(255, 59, 48, 0.3);
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.9rem;
      color: #999;
      border-top: 1px solid #eee;
      margin-top: 4rem;
      animation: fadeIn 1s ease-out;
    }

    /* Checkbox styling */
    .checkbox-container {
      display: flex;
      align-items: center;
      margin-bottom: 1.5rem;
      cursor: pointer;
    }

    .checkbox-container input {
      width: auto;
      margin-right: 0.75rem;
      accent-color: var(--primary);
    }

    /* File input styling */
    input[type="file"] {
      padding: 0.75rem;
      border: 1px dashed #ddd;
      background-color: white;
    }

    /* Readonly input styling */
    input[readonly] {
      background-color: #f0f0f0;
      color: var(--subtext);
      cursor: not-allowed;
    }

    /* Credit card input grouping */
    .card-input-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    /* Status indicators */
    .status-pending {
      color: var(--warning);
    }
    
    .status-confirmed {
      color: var(--success);
    }
    
    .status-cancelled {
      color: var(--error);
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .card {
        padding: 1.5rem;
      }
      
      .card-input-group {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      main {
        padding: 0 1rem;
      }
      
      .card {
        padding: 1.25rem;
      }
      
      h2 {
        font-size: 1.75rem;
      }
    }

    /* PayPal button container */
    #paypal-button-container {
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Credit Card Animation Styles */
    .credit-card {
      width: 100%;
      max-width: 400px;
      margin: 0 auto 2rem;
      perspective: 1000px;
    }

    .credit-card__inner {
      position: relative;
      width: 100%;
      height: 220px;
      transition: transform 0.8s;
      transform-style: preserve-3d;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .credit-card__front,
    .credit-card__back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 15px;
      padding: 20px;
      box-sizing: border-box;
      background: linear-gradient(135deg, #0072ff, #00c6ff);
      color: white;
    }

    .credit-card__back {
      transform: rotateY(180deg);
      background: linear-gradient(135deg, #00c6ff, #0072ff);
    }

    .credit-card__number {
      font-size: 22px;
      letter-spacing: 2px;
      margin-top: 40px;
      text-align: center;
      font-family: 'Courier New', monospace;
    }

    .credit-card__info {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
      font-size: 14px;
    }

    .credit-card__expiry {
      text-align: left;
    }

    .credit-card__name {
      text-align: left;
      text-transform: uppercase;
    }

    .credit-card__cvc {
      position: absolute;
      top: 100px;
      right: 30px;
      background: white;
      color: #333;
      padding: 5px 10px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
    }

    .credit-card__stripe {
      position: absolute;
      top: 20px;
      left: 0;
      width: 100%;
      height: 40px;
      background: rgba(0, 0, 0, 0.2);
    }

    .credit-card__signature {
      position: absolute;
      top: 80px;
      left: 20px;
      width: 60%;
      height: 30px;
      background: rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      padding-left: 10px;
      font-size: 12px;
      color: white;
    }

    .credit-card__logo {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 60px;
    }

    .credit-card__instructions {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
      color: var(--subtext);
    }

    /* Flip animation when focusing on CVC field */
    .flipped .credit-card__inner {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="appointments.html">Book Appointment</a></li>
        <li><a href="bookings.html">My Bookings</a></li>
        <li><a href="chat.html">Secure Chat</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Complete Payment</h2>
    
    <div id="login-message" style="display: none;">
      Please <a href="login.html" style="color: var(--primary);">login</a> to view payment options.
    </div>

    <div class="card" style="display: none;" id="payment-card">
      <form id="payment-form">
        <div class="form-group">
          <label for="appointment">Select Appointment:</label>
          <select id="appointment" name="appointment" required>
            <option value="">Select an appointment</option>
            <!-- Appointments will be loaded here -->
          </select>
        </div>

        <div class="form-group">
          <label for="amount">Amount (€):</label>
          <input type="number" id="amount" name="amount" value="50" min="50" max="50" readonly>
        </div>

        <div class="form-group">
          <div class="checkbox-container">
            <input type="checkbox" id="exemption-checkbox" name="exemption">
            <label for="exemption-checkbox">Esenzione Pagamento (20€)</label>
          </div>
          <div id="exemption-upload-section" style="display: none; margin-top: 1rem;">
            <label for="exemption-file">Carica documento di esenzione (PDF):</label>
            <input type="file" id="exemption-file" name="exemption-file" accept=".pdf" style="margin-top: 0.5rem;">
          </div>
        </div>

        <div class="form-group">
          <label for="payment-method">Payment Method:</label>
          <select id="payment-method" name="payment-method" required>
            <option value="">Select payment method</option>
            <option value="credit_card">Credit Card</option>
            <option value="paypal">PayPal</option>
            <option value="bank_transfer">Bank Transfer</option>
            <option value="insurance">Insurance Package</option>
          </select>
        </div>

        <!-- Insurance Options -->
        <div id="insurance-options" class="payment-section">
          <div class="form-group">
            <label for="insurance-package">Choose Insurance Package:</label>
            <select id="insurance-package" name="insurance-package">
              <option value="">Select package</option>
              <option value="basic">Basic</option>
              <option value="premium">Premium</option>
              <option value="family">Family</option>
            </select>
          </div>
        </div>

        <!-- PayPal Card Section -->
        <div id="paypal-button-container" class="payment-section"></div>
        
        <!-- Credit Card Section -->
        <div id="credit-card-section" class="payment-section">
          <!-- Credit Card Animation -->
          <div class="credit-card" id="credit-card-animation">
            <div class="credit-card__inner">
              <div class="credit-card__front">
                <div class="credit-card__stripe"></div>
                <div class="credit-card__logo">VISA</div>
                <div class="credit-card__number">•••• •••• •••• ••••</div>
                <div class="credit-card__info">
                  <div class="credit-card__name">CARD HOLDER</div>
                  <div class="credit-card__expiry">MM/YY</div>
                </div>
              </div>
              <div class="credit-card__back">
                <div class="credit-card__stripe"></div>
                <div class="credit-card__cvc">•••</div>
                <div class="credit-card__signature">Authorized Signature</div>
              </div>
            </div>
            <div class="credit-card__instructions">Click on CVC field to flip card</div>
          </div>

          <div class="form-group">
            <label for="credit-card-number">Credit Card Number:</label>
            <input type="text" id="credit-card-number" name="credit-card-number" maxlength="19" placeholder="Card number" pattern="\d{16,19}">
          </div>
          <div class="card-input-group">
            <div class="form-group">
              <label for="credit-card-expiry">Expiry Date:</label>
              <input type="text" id="credit-card-expiry" name="credit-card-expiry" maxlength="5" placeholder="MM/YY" pattern="\d{2}/\d{2}">
            </div>
            <div class="form-group">
              <label for="credit-card-cvc">CVC:</label>
              <input type="text" id="credit-card-cvc" name="credit-card-cvc" maxlength="4" placeholder="CVC" pattern="\d{3,4}">
            </div>
          </div>
          <div class="form-group">
            <label for="credit-card-holder">Card Holder Name:</label>
            <input type="text" id="credit-card-holder" name="credit-card-holder" maxlength="40" placeholder="Name on card">
          </div>
        </div>

        <!-- Bank Transfer Section -->
        <div id="bank-transfer-section" class="payment-section">
          <div class="form-group">
            <label for="bank-account">Bank Account IBAN:</label>
            <input type="text" id="bank-account" name="bank-account" maxlength="34" placeholder="IBAN">
          </div>
          <div class="form-group">
            <label for="bank-holder">Account Holder Name:</label>
            <input type="text" id="bank-holder" name="bank-holder" maxlength="40" placeholder="Name on account">
          </div>
        </div>

        <button type="submit" class="btn">Pay Now</button>
        <div id="payment-message" class="message"></div>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Telemedicine Portal</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('token');
      const paymentCard = document.getElementById('payment-card');
      const loginMessage = document.getElementById('login-message');

      if (!token) {
        showLoginPrompt();
        return;
      }

      try {
        const verifyResponse = await fetch('http://localhost:5501/user-data', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!verifyResponse.ok) {
          throw new Error('Session expired');
        }

        // Load appointments for payment
        await loadAppointments(token);
        
        // Setup payment method selection
        document.getElementById('payment-method').addEventListener('change', function() {
          const sections = document.querySelectorAll('.payment-section');
          sections.forEach(section => section.style.display = 'none');
          
          // Reset required attributes
          document.querySelectorAll('.payment-section input, .payment-section select').forEach(el => {
            el.removeAttribute('required');
          });

          switch(this.value) {
            case 'insurance':
              document.getElementById('insurance-options').style.display = 'block';
              document.getElementById('insurance-package').setAttribute('required', 'required');
              break;
            case 'paypal':
              document.getElementById('paypal-button-container').style.display = 'block';

              // Load PayPal buttons only if not already loaded
              if (!document.getElementById('paypal-button-container').hasChildNodes()) {
                paypal.Buttons({
                  style: {
                    layout: 'vertical',
                    color:  'blue',
                    shape:  'rect',
                    label:  'paypal'
                  },
                  createOrder: function(data, actions) {
                    const amount = document.getElementById('amount').value || '50.00';
                    return actions.order.create({
                      purchase_units: [{
                        amount: {
                          value: amount
                        }
                      }]
                    });
                  },
                  onApprove: function(data, actions) {
                    return actions.order.capture().then(function(details) {
                      // Call backend to register payment
                      registerPayment(details);
                    });
                  },
                  onError: function(err) {
                    console.error('PayPal error:', err);
                    const message = document.getElementById('payment-message');
                    message.textContent = "PayPal error. Please try again.";
                    message.className = "message error";
                  }
                }).render('#paypal-button-container');
              }
              break;
            case 'credit_card':
              document.getElementById('credit-card-section').style.display = 'block';
              document.getElementById('credit-card-number').setAttribute('required', 'required');
              document.getElementById('credit-card-expiry').setAttribute('required', 'required');
              document.getElementById('credit-card-cvc').setAttribute('required', 'required');
              document.getElementById('credit-card-holder').setAttribute('required', 'required');
              break;
            case 'bank_transfer':
              document.getElementById('bank-transfer-section').style.display = 'block';
              document.getElementById('bank-account').setAttribute('required', 'required');
              document.getElementById('bank-holder').setAttribute('required', 'required');
              break;
          }
        });

        // Handle exemption checkbox
        document.getElementById('exemption-checkbox').addEventListener('change', function() {
          const uploadSection = document.getElementById('exemption-upload-section');
          const amountField = document.getElementById('amount');
          
          if (this.checked) {
            uploadSection.style.display = 'block';
            amountField.value = '20';
            amountField.min = '20';
            amountField.max = '20';
          } else {
            uploadSection.style.display = 'none';
            amountField.value = '50';
            amountField.min = '50';
            amountField.max = '50';
          }
        });

        // Credit Card Animation Logic
        const creditCardAnimation = document.getElementById('credit-card-animation');
        const creditCardCvcInput = document.getElementById('credit-card-cvc');
        
        if (creditCardCvcInput) {
          creditCardCvcInput.addEventListener('focus', () => {
            creditCardAnimation.classList.add('flipped');
          });
          
          creditCardCvcInput.addEventListener('blur', () => {
            creditCardAnimation.classList.remove('flipped');
          });
          
          // Update card details as user types
          document.getElementById('credit-card-number').addEventListener('input', function() {
            const cardNumberDisplay = document.querySelector('.credit-card__number');
            const value = this.value.replace(/\s/g, '').replace(/\D/g, '');
            let formatted = '';
            
            for (let i = 0; i < value.length; i++) {
              if (i > 0 && i % 4 === 0) formatted += ' ';
              formatted += value[i];
            }
            
            // Show only last 4 digits, mask the rest
            if (formatted.length > 0) {
              const visibleDigits = 4;
              const masked = formatted.slice(0, -visibleDigits).replace(/\d/g, '•') + formatted.slice(-visibleDigits);
              cardNumberDisplay.textContent = masked || '•••• •••• •••• ••••';
            } else {
              cardNumberDisplay.textContent = '•••• •••• •••• ••••';
            }
          });
          
          document.getElementById('credit-card-holder').addEventListener('input', function() {
            const cardHolderDisplay = document.querySelector('.credit-card__name');
            cardHolderDisplay.textContent = this.value.toUpperCase() || 'CARD HOLDER';
          });
          
          document.getElementById('credit-card-expiry').addEventListener('input', function() {
            const expiryDisplay = document.querySelector('.credit-card__expiry');
            expiryDisplay.textContent = this.value || 'MM/YY';
          });
          
          document.getElementById('credit-card-cvc').addEventListener('input', function() {
            const cvcDisplay = document.querySelector('.credit-card__cvc');
            cvcDisplay.textContent = this.value.replace(/\D/g, '').replace(/./g, '•') || '•••';
          });
        }

        // Handle payment submission
        document.getElementById('payment-form').addEventListener('submit', async function(e) {
          e.preventDefault();
          
          const appointmentId = document.getElementById('appointment').value;
          const method = document.getElementById('payment-method').value;
          const amount = document.getElementById('amount').value;
          const isExempt = document.getElementById('exemption-checkbox').checked;
          const exemptionFile = document.getElementById('exemption-file').files[0];
          const message = document.getElementById('payment-message');
          
          // Validate exemption
          if (isExempt && !exemptionFile) {
            message.textContent = "Per favore carica il documento di esenzione";
            message.className = "message error";
            return;
          }

          let payload = {
            user_id: localStorage.getItem('user_id'),
            appointment_id: appointmentId,
            method: isExempt ? 'exemption' : method,
            amount,
            is_exempt: isExempt
          };

          // If exemption, use FormData for file upload
          if (isExempt) {
            const formData = new FormData();
            formData.append('exemption_file', exemptionFile);
            formData.append('payment_data', JSON.stringify(payload));
            
            try {
              const res = await fetch('http://localhost:5502/payments', {
                method: 'POST',
                headers: { 
                  'Authorization': `Bearer ${token}`
                },
                body: formData
              });
              
              const data = await res.json();
              if (data.success) {
                message.textContent = "Esenzione registrata con successo!";
                message.className = "message success";
              } else {
                message.textContent = data.error || "Registrazione esenzione fallita!";
                message.className = "message error";
              }
            } catch (error) {
              console.error('Error:', error);
              message.textContent = "Errore durante l'upload del file. Riprova.";
              message.className = "message error";
            }
          } else {
            // Normal payment
            // Add payment method specific fields
            if (method === 'credit_card') {
              payload.card_number = document.getElementById('credit-card-number').value.trim();
              payload.card_expiry = document.getElementById('credit-card-expiry').value.trim();
              payload.card_cvc = document.getElementById('credit-card-cvc').value.trim();
              payload.card_holder = document.getElementById('credit-card-holder').value.trim();
            } else if (method === 'bank_transfer') {
              payload.bank_iban = document.getElementById('bank-account').value.trim();
              payload.bank_holder = document.getElementById('bank-holder').value.trim();
            } else if (method === 'insurance') {
              payload.insurance_package = document.getElementById('insurance-package').value;
            }

            try {
              const res = await fetch('http://localhost:5502/payments', {
                method: 'POST',
                headers: { 
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(payload)
              });
              
              const data = await res.json();
              if (data.success) {
                message.textContent = "Payment successful!";
                message.className = "message success";
              } else {
                message.textContent = data.error || "Payment failed!";
                message.className = "message error";
              }
            } catch (error) {
              console.error('Payment error:', error);
              message.textContent = "Payment failed! Please try again.";
              message.className = "message error";
            }
          }
          
          setTimeout(() => { 
            message.textContent = "";
            message.className = "message";
          }, 4000);
        });

        paymentCard.style.display = 'block';
        loginMessage.style.display = 'none';
      } catch (error) {
        console.error('Error:', error);
        handleError(error);
      }
    });

    async function loadAppointments(token) {
      const response = await fetch('http://localhost:5501/appointments', {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (!response.ok) {
        throw new Error('Failed to load appointments');
      }

      const data = await response.json();
      const select = document.getElementById('appointment');
      
      data.appointments.forEach(app => {
        const opt = document.createElement('option');
        opt.value = app.id;
        opt.textContent = `${app.date} ${app.time} with Dr. ${app.doctor_nome} ${app.doctor_cognome}`;
        select.appendChild(opt);
      });
    }

    function showLoginPrompt() {
      document.getElementById('payment-card').style.display = 'none';
      document.getElementById('login-message').style.display = 'block';
    }

    function handleError(error) {
      if (error.message.includes('Session')) {
        localStorage.clear();
        window.location.href = 'login.html';
        return;
      }

      const paymentCard = document.getElementById('payment-card');
      paymentCard.innerHTML = `
        <div style="color: var(--error); text-align: center;">
          ${error.message}<br>
          <button class="btn" onclick="location.reload()">Retry</button>
        </div>
      `;
      paymentCard.style.display = 'block';
      document.getElementById('login-message').style.display = 'none';
    }

    async function registerPayment(details) {
      const token = localStorage.getItem('token');
      const userId = localStorage.getItem('user_id');
      const appointmentId = document.getElementById('appointment').value;
      const amount = document.getElementById('amount').value;
      const message = document.getElementById('payment-message');

      const payload = {
        user_id: userId,
        appointment_id: appointmentId,
        method: 'paypal',
        amount: amount,
        paypal_transaction_id: details.id,
        paypal_payer_email: details.payer.email_address
      };

      try {
        const res = await fetch('http://localhost:5502/payments', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.success) {
          message.textContent = "PayPal payment successful!";
          message.className = "message success";
        } else {
          message.textContent = data.error || "Payment failed!";
          message.className = "message error";
        }
      } catch (err) {
        console.error('Register payment error:', err);
        message.textContent = "Server error. Please try again.";
        message.className = "message error";
      }

      setTimeout(() => {
        message.textContent = "";
        message.className = "message";
      }, 4000);
    }
  </script>
</body>
</html>
